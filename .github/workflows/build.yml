name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest


  build:
    name: Build (${{ matrix.os }})
    needs: test

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --dev

      - name: Build executable
        run: |
          uv run python -m nuitka \
            --python-flag=-m \
            --mode=onefile \
            --output-dir=build \
            --output-filename=brainfoo \
            --include-package=textual \
            --include-data-dir=src/brainfoo/assets=brainfoo/assets \
            src/brainfoo

      - name: Rename executable
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            mv build/brainfoo.exe build/brainfoo-windows.exe
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            mv build/brainfoo.bin build/brainfoo-linux
          else
            mv build/brainfoo.bin build/brainfoo-macos
          fi

      - name: Remove build leftovers
        shell: bash
        run: |
          rm -rf build/*.build
          rm -rf build/*.dist
          rm -rf build/*.onefile-build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: brainfoo-${{ runner.os }}
          path: build/brainfoo-*


  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build

    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
